[settings]
experimental = true
lockfile = true
lockfile_mode = "generate"
lockfile_platforms = ["macos-arm64"]
disable_backends = ["asdf", "vfox"]
idiomatic_version_file_enable_tools = ["rust"]

[settings.node]
corepack = true

[tools]
1password = "2.34.1"
bat = "0.26.1"
"cargo:cargo-machete" = "0.9.2"
"conda:btop" = "1.4.7"
"conda:curl" = "8.22.0"
"conda:pstree" = "2.39"
"conda:tree" = "2.3.2"
"conda:wget" = "1.25.0"
direnv = "2.37.1"
fd = "10.4.2"
fzf = "0.73.1"
gh = "2.96.0"
hostctl = "1.1.4"
jq = "1.8.2"
lazygit = "0.63.0"
mkcert = "1.4.4"
neovim = "0.12.0"
"npm:@agentclientprotocol/codex-acp" = "2.1.1"
"npm:@earendil-works/pi-coding-agent" = "0.80.10"
"npm:@playwright/mcp" = "0.0.83"
"npm:@upstash/context7-mcp" = "4.1.1"
"npm:chrome-devtools-mcp" = "1.10.1"
oxfmt = "0.71.0"
ripgrep = "15.1.0"
starship = "1.26.0"
terraform = "1.15.7"
tree-sitter = "0.26.10"
typos = "1.48.0"
yamlfmt = "0.21.0"
zellij = "0.44.3"

[tools.go]
version = "1.26.4"

[tools.node]
version = "24.21.0"

[tools.python]
version = "3.14.7"

[tools.rust]
version = "1.99.0"
profile = "minimal"
components = ["clippy", "rustfmt", "rust-analyzer", "rust-src"]
targets = ["wasm32-wasip1"]

## System Settings

[bootstrap.macos.keyboard]
automatic_capitalization = false
automatic_spelling_correction = false
fn_state = true

[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"

[bootstrap.macos.dock]
autohide = true
tilesize = 28

[bootstrap.macos.defaults.NSGlobalDomain]
AppleLanguages = ["en-RU", "en", "ru-RU"]
AppleLocale = "en_RU"
AppleMeasurementUnits = "Centimeters"
AppleMetricUnits = true
AppleTemperatureUnit = "Celsius"
AppleICUForce24HourTime = true
AppleIconAppearanceTheme = "RegularDark"
AppleShowAllExtensions = true
AppleKeyboardUIMode = 2
_HIHideMenuBar = true
AppleMenuBarVisibleInFullscreen = false
NSAutomaticPeriodSubstitutionEnabled = true
NSAutomaticQuoteSubstitutionEnabled = true
NSAutomaticDashSubstitutionEnabled = true
"com.apple.swipescrolldirection" = false

[bootstrap.macos.defaults."com.apple.controlcenter"]
AutoHideMenuBarOption = 0

[bootstrap.macos.defaults."com.apple.WindowManager"]
GloballyEnabled = true
AutoHide = true
AppWindowGroupingBehavior = 1
HideDesktop = true
StageManagerHideWidgets = false
StageFrameMinimumHorizontalInset = 0

[bootstrap.macos.defaults."com.apple.widgets"]
widgetAppearance = 0 # Always dim desktop widgets

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
Clicking = true
TrackpadThreeFingerDrag = false

# [bootstrap.macos.defaults."com.apple.universalaccess"]
# reduceMotion = true

[bootstrap.macos.defaults."org.hammerspoon.Hammerspoon"]
MJConfigFile = "~/.config/hammerspoon/init.lua"

# Disable font smoothing
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "AppleFontSmoothing"
host = "current"
value = 0

### Keybinds

# Menu focus: ⌃ F2 (ZMK MENU_FOCUS)
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["7"]
value = { enabled = true, value = { parameters = [65535, 120, 8650752], type = "standard" } }

# Status menu focus: ⌃ Fn F8 (Keyboard Maestro maps ZMK TRAY_FOCUS/F20 to this shortcut)
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["57"]
value = { enabled = true, value = { parameters = [65535, 100, 8650752], type = "standard" } }

# Next window focus: ⌘ `
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["27"]
value = { enabled = true, value = { parameters = [96, 50, 1048576], type = "standard" } }

# Mission Control: ⌘ ⌃ ⌥ M
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["32"]
value = { enabled = true, value = { parameters = [109, 46, 1835008], type = "standard" } }

# Reserve ⌃ ↓ for Neovim; disable App Exposé (Application windows).
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["33", "enabled"]
value = false

# Move left a Space: ⌃ ← (reserved for apps)
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["79", "enabled"]
value = false

# Move right a Space: ⌃ → (reserved for apps)
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["81", "enabled"]
value = false

# Move left a Space, slow: ⌃ ⇧ ←
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["80", "enabled"]
value = false

# Move right a Space, slow: ⌃ ⇧ →
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["82", "enabled"]
value = false

# Hammerspoon owns language switching; disable both native input-source shortcuts.
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["60", "enabled"]
value = false

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["61", "enabled"]
value = false

# Reserve ⌘ ␣ for better stuff
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["64", "enabled"]
value = false

# Widgets / Notification Center: ⌘ ⌃ ⌥ N
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["163"]
value = { enabled = true, value = { parameters = [110, 45, 1835008], type = "standard" } }

# Stage Manager toggle: ⌘ ⌃ ⌥ F
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["222"]
value = { enabled = true, value = { parameters = [102, 3, 1835008], type = "standard" } }

