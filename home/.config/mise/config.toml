# Neovide: building from main
[tasks."apps:neovide"]
description = "Build and install Neovide from the existing local source checkout"
dir = "{{env.HOME}}/Projects/upstream/neovide"
run = '''
cargo build --locked --release --target aarch64-apple-darwin
GENERATE_BUNDLE_APP=true GENERATE_DMG=false ./macos-builder/run aarch64-apple-darwin
cargo install --locked --path . --target aarch64-apple-darwin
ditto target/aarch64-apple-darwin/release/bundle/osx/Neovide.app /Applications/Neovide.app
'''

## Power modes

[tasks."power:normal"]
description = "Restore macOS power-management defaults"
run = "sudo /usr/bin/pmset restoredefaults"

[tasks."power:away"]
description = "Prevent idle system sleep on AC power"
run = "sudo /usr/bin/pmset -c sleep 0"
