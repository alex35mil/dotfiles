[sandbox]
presets = [
    "mise",
    "rust",
    "pi-claude-code",
]

[sandbox.filesystem]
"$HOME/Projects/personal/configs/dotfiles/home/.config/shell/secrets.sh" = "deny"

[tools.permissions]
deny = [
    "read(*mise.local.toml)",
    "read(.env)",
    "read(.env.*)",
    "read(*/.env)",
    "read(*/.env.*)",
    "read(*/auth.json)",
    "bash(* *mise.local.toml*)",
    "bash(* *auth.json*)",
    "bash(grep *)",
    "bash(egrep *)",
    "bash(fgrep *)",
    "bash(find * -exec *)",
    "bash(find * -execdir *)",
    "bash(find * -ok *)",
    "bash(find * -okdir *)",
    "bash(find * -delete*)",
    "bash(rg * --pre *)",
    "bash(rg * --pre=*)",
    "bash(rg --pre *)",
    "bash(rg --pre=*)",
]

[tools.permissions.host]
default_mode = "ask"
allow = [
    "codemode",
    "read",
    "grep",
    "find",
    "ls",
    "fetch",
    "web_search",
    "git_read",
    "bash(ls *)",
    "bash(find * -name *)",
    "bash(find * -type *)",
    "bash(find * -path *)",
    "bash(rg *)",
    "bash(head *)",
    "bash(tail *)",
    "bash(cat *)",
    "bash(wc *)",
    "bash(file *)",
    "bash(stat *)",
    "bash(diff *)",
    "bash(tree *)",
    "bash(which *)",
    "bash(type *)",
    "bash(realpath *)",
    "bash(basename *)",
    "bash(dirname *)",
    "bash(date *)",
